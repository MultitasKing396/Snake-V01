<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake NFC Mini Game</title>
<style>
  body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 15px; user-select: none; }
  .head { font-size: 14px; letter-spacing: 1px; margin-bottom: 10px; color: #ccc; }
  .head b { color: #0f0; font-size: 16px; }
  .reset { margin-bottom: 12px; padding: 8px 18px; font-size: 14px; background: #333; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  canvas { background: #000; border: 2px solid #444; display: block; margin: 0 auto 12px; }
  .pad button { width: 56px; height: 56px; font-size: 20px; margin: 3px; background: #222; color: #fff; border: 1px solid #444; border-radius: 8px; }
  .pad button:active { background: #444; }
  .pause { margin-top: 76px; width: 64px; height: 48px; font-size: 20px; background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 8px; cursor: pointer; }
  .pause:active { background: #444; }
  .info { font-size: 12px; color: #888; margin-top: 16px; }
</style>
</head>
<body>
  <div class="head">SNAKE NFC MINI GAME · VERSION 0.1<br>PUNKTE <b id="p">0</b></div>
  <button class="reset" onclick="i()">Neu starten</button>
  <canvas id="c" width="300" height="240"></canvas>
  <div class="pad">
    <button onclick="d(0,-1)">▲</button><br>
    <button onclick="d(-1,0)">◀</button>
    <button onclick="d(0,1)">▼</button>
    <button onclick="d(1,0)">▶</button>
  </div>
  <button id="pb" class="pause" onclick="tp()">❚❚</button>
  <div class="info">by Alp</div>

<script>
const x = c.getContext("2d");
let s, vx, vy, fx, fy, n, t, paused, over;

function getSpeed() {
  if (n >= 20) return 178;
  if (n >= 10) return 187;
  return 196;
}

function i() {
  s = Array.of({x: 7, y: 6});
  vx = 1; vy = 0;
  fx = 11; fy = 6;
  p.innerText = n = 0;
  paused = false;
  over = false;
  pb.innerText = "❚❚";
  clearInterval(t);
  t = setInterval(u, getSpeed());
}

function tp() {
  if (over) return;
  paused = !paused;
  if (paused) {
    clearInterval(t);
    pb.innerText = "▶";
  } else {
    pb.innerText = "❚❚";
    t = setInterval(u, getSpeed());
  }
}

function d(a, b) {
  if (paused) return;
  if (a !== -vx || b !== -vy) { vx = a; vy = b; }
}

function u() {
  const head = s.at(0);
  const nx = head.x + vx;
  const ny = head.y + vy;
  if (nx < 0 || nx > 14 || ny < 0 || ny > 11 || s.some(e => e.x === nx && e.y === ny)) {
    over = true;
    return clearInterval(t);
  }
  s.unshift({x: nx, y: ny});
  if (nx === fx && ny === fy) {
    p.innerText = ++n;
    if (n === 10 || n === 20) {
      clearInterval(t);
      t = setInterval(u, getSpeed());
    }
    fx = Math.floor(Math.random() * 15);
    fy = Math.floor(Math.random() * 12);
  } else {
    s.pop();
  }
  x.clearRect(0, 0, 300, 240);
  x.fillStyle = "red";
  x.fillRect(fx * 20, fy * 20, 19, 19);
  s.forEach((e, idx) => {
    x.fillStyle = idx === 0 ? "#fff" : "#0f0";
    x.fillRect(e.x * 20, e.y * 20, 19, 19);
  });
}

onkeydown = e => {
  if (e.key === "ArrowLeft") d(-1, 0);
  if (e.key === "ArrowUp") d(0, -1);
  if (e.key === "ArrowRight") d(1, 0);
  if (e.key === "ArrowDown") d(0, 1);
  if (e.key === " ") tp();
};
i();
</script>
</body>
</html>
