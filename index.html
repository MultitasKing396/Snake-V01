<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake NFC Mini Game</title>
<style>
  body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 15px; user-select: none; }
  .head { font-size: 14px; letter-spacing: 1px; margin-bottom: 10px; color: #ccc; }
  .head b { color: #00ff00; font-size: 16px; }
  .reset { margin-bottom: 12px; padding: 8px 18px; font-size: 14px; background: #333; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  canvas { background: #000; border: 2px solid #444; display: block; margin: 0 auto 12px; cursor: pointer; touch-action: none; }
  .pad button { width: 59px; height: 59px; font-size: 20px; margin: 6px; background: #222; color: #fff; border: 1px solid #444; border-radius: 8px; }
  .pad button:active { background: #444; }
  .pause { margin-top: 76px; width: 64px; height: 48px; font-size: 20px; background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 8px; cursor: pointer; }
  .pause:active { background: #444; }
  .info { font-size: 12px; color: #888; margin-top: 16px; }
</style>
</head>
<body>
  <div class="head">SNAKE NFC MINI GAME<br>PUNKTE <b id="p">0</b></div>
  <button class="reset" onclick="i()">Neu starten</button>
  <canvas id="c" width="300" height="240" onclick="if(over){i();tp();}"></canvas>
  <div class="pad">
    <button onclick="d(0,-1)">▲</button><br>
    <button onclick="d(-1,0)">◀</button>
    <button onclick="d(0,1)">▼</button>
    <button onclick="d(1,0)">▶</button>
  </div>
  <button id="pb" class="pause" onclick="tp()">▶</button>
  <div class="info">by Alp</div>

<script>
const x = c.getContext("2d");
const colors = Array.of("#00ff00", "#aaff00", "#ffee00", "#ffbb00", "#ff7700", "#00e5ff", "#3388ff", "#cc33ff");
let s, vx, vy, fx, fy, n, t, paused, over, tx, ty;
let hi = Number(localStorage.getItem("snake_nfc_hi")) || 0;

function getStep() {
  return Math.min(Math.floor(n / 10), 7);
}

function getSpeed() {
  return Math.round(196 / Math.pow(1.03, getStep()));
}

function getColor() {
  return colors.at(getStep());
}

function spawnFood() {
  if (s.length >= 180) return;
  let valid = false;
  while (!valid) {
    fx = Math.floor(Math.random() * 15);
    fy = Math.floor(Math.random() * 12);
    valid = !s.some(e => e.x === fx && e.y === fy);
  }
}

function draw() {
  x.clearRect(0, 0, 300, 240);
  x.fillStyle = "red";
  x.fillRect(fx * 20, fy * 20, 19, 19);
  const bodyColor = getColor();
  s.forEach((e, idx) => {
    x.fillStyle = idx === 0 ? "#fff" : bodyColor;
    x.fillRect(e.x * 20, e.y * 20, 19, 19);
  });

  if (over) {
    x.fillStyle = "rgba(0, 0, 0, 0.78)";
    x.fillRect(0, 0, 300, 240);
    x.textAlign = "center";

    x.fillStyle = "#ff3b30";
    x.font = "bold 26px sans-serif";
    x.fillText("GAME OVER", 150, 82);

    x.fillStyle = "#ffffff";
    x.font = "bold 16px sans-serif";
    x.fillText("Erreichte Punkte: " + n, 150, 120);

    x.fillStyle = n >= hi && n > 0 ? bodyColor : "#aaaaaa";
    x.font = "14px sans-serif";
    x.fillText("Highscore: " + hi, 150, 146);

    x.fillStyle = "#777777";
    x.font = "12px sans-serif";
    x.fillText("Tippen für neue Runde", 150, 185);
  }
}

function i() {
  s = Array.of({x: 7, y: 6});
  vx = 1; vy = 0;
  fx = 11; fy = 6;
  p.innerText = n = 0;
  p.style.color = getColor();
  paused = true;
  over = false;
  pb.innerText = "▶";
  clearInterval(t);
  draw();
}

function tp() {
  if (over) {
    i();
  }
  paused = !paused;
  if (paused) {
    clearInterval(t);
    pb.innerText = "▶";
  } else {
    pb.innerText = "❚❚";
    t = setInterval(u, getSpeed());
  }
}

function d(a, b) {
  if (paused || over) return;
  if (a !== -vx || b !== -vy) { vx = a; vy = b; }
}

function u() {
  const head = s.at(0);
  const nx = head.x + vx;
  const ny = head.y + vy;
  if (nx < 0 || nx > 14 || ny < 0 || ny > 11 || s.some(e => e.x === nx && e.y === ny)) {
    over = true;
    pb.innerText = "▶";
    clearInterval(t);
    if (n > hi) {
      hi = n;
      localStorage.setItem("snake_nfc_hi", hi);
    }
    return draw();
  }
  s.unshift({x: nx, y: ny});
  if (nx === fx && ny === fy) {
    p.innerText = ++n;
    if (n <= 70 && n % 10 === 0) {
      p.style.color = getColor();
      clearInterval(t);
      t = setInterval(u, getSpeed());
    }
    spawnFood();
  } else {
    s.pop();
  }
  draw();
}

c.addEventListener("touchstart", e => {
  const touch = e.changedTouches.item(0);
  tx = touch.clientX;
  ty = touch.clientY;
}, {passive: true});

c.addEventListener("touchend", e => {
  const touch = e.changedTouches.item(0);
  const dx = touch.clientX - tx;
  const dy = touch.clientY - ty;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    d(dx > 0 ? 1 : -1, 0);
  } else {
    d(0, dy > 0 ? 1 : -1);
  }
}, {passive: true});

onkeydown = e => {
  if (e.key === "ArrowLeft") d(-1, 0);
  if (e.key === "ArrowUp") d(0, -1);
  if (e.key === "ArrowRight") d(1, 0);
  if (e.key === "ArrowDown") d(0, 1);
  if (e.key === " ") tp();
};
i();
</script>
</body>
</html>
